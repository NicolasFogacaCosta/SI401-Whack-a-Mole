<!DOCTYPE html>
<html lang="pt">
    <head>
        <meta charset="UTF-8">
        <title>Whack-a-Mole Cadastro</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <header class="login-screen">
            <div class="login-screen-art">
                <img src="img/thumb-mole.jpg" alt="thumb-art">
            </div>

            <div class="login-screen-title">
                <h1>Cadastre-se agora!</h1>
            </div>
        </header>

        <main class="forms">
            <section class="forms-card">
                <form id="cadastro-form" novalidate>
                    <div class="field">
                        <label for="full_name">Nome Completo</label>
                        <input id="full_name" type="text" required>
                    </div>

                    <div class="field">
                        <label for="birthday">Data de Nascimento</label>
                        <input id="birthday" type="date" required>
                    </div>

                    <div class="field">
                        <label for="cpf">CPF</label>
                        <input id="cpf" type="text" maxlength="14" placeholder="000.000.000-00" required>
                    </div>

                    <div class="field">
                        <label for="phone">Telefone</label>
                        <input id="phone" type="text" maxlength="15" placeholder="(00) 00000-0000" required>
                    </div>

                    <div class="field">
                        <label for="email">E-mail</label>
                        <input id="email" type="text" required>
                    </div>

                    <div class="field">
                        <label for="user">Usuário</label>
                        <input id="user" type="text" required>
                    </div>

                    <div class="field">
                        <label for="password">Senha</label>
                        <input id="password" type="password" required>
                    </div>

                    <p id="form-error" role="alert" hidden></p> <!-- Exibir o alerta mediante validacao Java futura --> 

                    <button type="submit" class="btn btn--primary">Criar contar</button>
                </form>

                <a href="index.html" class="link-secundario">Voltar ao Login</a>
            </section>
        </main>
    </body>
</html>
