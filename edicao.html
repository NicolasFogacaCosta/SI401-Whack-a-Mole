<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <title>Whack-a-Mole Edite o Cadastro</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/edicao.css" />
  </head>

  <body>
    <header class="login-screen">
      <div class="login-screen-art">
        <img src="img/thumb-mole.jpg" alt="thumb-art" />
      </div>

      <div class="login-screen-title">
        <h1>Altere seu cadastro!</h1>
      </div>
    </header>

    <main class="forms">
      <section class="forms-card edicao-card">
        <form id="cadastro-form" novalidate>
          <div class="field">
            <label for="full_name">Nome Completo</label>
            <input id="full_name" type="text" required />
          </div>

          <div class="field">
            <label for="phone">Telefone</label>
            <input
              id="phone"
              type="text"
              maxlength="15"
              placeholder="(00) 00000-0000"
              required
            />
          </div>

          <div class="field">
            <label for="email">E-mail</label>
            <input id="email" type="text" required />
          </div>

          <div class="field">
            <label for="password">Senha</label>
            <input id="password" type="password" required />
          </div>

          <p id="form-error" role="alert" hidden></p>
          <!-- Exibir o alerta mediante validacao Java futura -->

          <button type="submit" class="btn btn--primary">Alterar</button>
        </form>

        <a href="ranking.html" class="link-secundario">Voltar ao Ranking</a>
      </section>
    </main>
  </body>
</html>
