<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whack-a-Mole | Partida em andamento</title>
    <link rel="stylesheet" href="../../public/assets/css/style.css">
    <link rel="stylesheet" href="../../public/assets/css/partida.css">
    <link rel="icon" href="../../public/assets/img/toupeira-favicon.ico">
  </head>

  <body>
    <header class="login-screen">
      <div class="login-screen-art art--jogo">
        <img src="../../public/assets/img/emblema-jogo.jpeg" alt="Marreta erguida sobre uma toca, prestes a descer">
      </div>

      <div class="login-screen-title">
        <h1>Partida em andamento</h1>
      </div>
    </header>

    <main class="forms">
      <div class="forms-card forms-card--largo partida-card">
        <div class="hud" role="status">
          <div class="hud-item">
            <span class="hud-rotulo">Modalidade</span>
            <strong class="hud-valor" id="hud-modalidade">-</strong>
          </div>

          <div class="hud-item">
            <span class="hud-rotulo">Tempo restante</span>
            <time class="hud-valor hud-valor--destaque" id="hud-tempo" datetime="PT15S">00:15</time>
          </div>

          <div class="hud-item">
            <span class="hud-rotulo">Nível</span>
            <strong class="hud-valor" id="hud-nivel">1</strong>
          </div>

          <div class="hud-item">
            <span class="hud-rotulo">Toupeiras acertadas</span>
            <output class="hud-valor" id="hud-acertos">0</output>
          </div>
        </div>

        <div class="nivel">
          <div class="nivel-topo">
            <span id="nivel-titulo">Acertos no nível atual</span>
            <output class="nivel-percentual" id="hud-percentual">0%</output>
          </div>

          <div class="barra-wrap">
            <progress class="barra" id="hud-barra" value="0" max="100" aria-labelledby="nivel-titulo">0%</progress>
            <span class="barra-meta barra-meta--90"></span>
          </div>

            <p class="nivel-meta" id="nivel-meta">
            Meta para avançar de nível: <strong>90%</strong> de acertos dentro do tempo do nível.
          </p>
        </div>

        <div class="tabuleiro-wrap">
          <div class="tabuleiro" id="tabuleiro" aria-label="Tabuleiro do jogo"></div>

          <p class="tabuleiro-legenda">
            Tabuleiro <strong id="hud-dimensoes">-</strong>
          </p>
        </div>

        <div class="partida-acoes">
          <button type="button" id="desistir" class="btn btn--tertiary">Desistir da partida</button>
        </div>

        <p id="mensagem-jogo" class="link-secundario" role="status"></p>
      </div>
    </main>
    <script src="js/partida.js" defer></script>
  </body>
</html>
