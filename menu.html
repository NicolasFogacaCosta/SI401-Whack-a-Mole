<!DOCTYPE html>
<html lang="pt">
    <head>
        <meta charset="UTF-8">
        <title>Whack-a-Mole Menu</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <header class="login-screen">
            <div class="login-screen-art">
                <img src="img/thumb-mole.jpg" alt="thumb-art">
            </div>

            <div class="login-screen-title">
                <h1>Whack-a-Mole</h1>
            </div>
        </header>

        <main class="forms">
            <section class="forms-card">
                <div class="field">
                    <button type="button" class="btn btn--primary">Iniciar Jogo</button> 
                </div>
                
                <div class="field">
                    <button type="button" class="btn btn--secondary">Ranking Global</button> 
                </div>
                
                <div class="field">
                    <button type="button" class="btn btn--tertiary">Desconectar</button> 
                </div>
            </section>
        </main>
    </body>
</html>
